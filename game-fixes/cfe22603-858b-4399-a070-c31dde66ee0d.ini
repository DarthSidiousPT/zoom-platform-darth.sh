# The Colony
#
# ZOOM's installer makes three shortcuts (DOS, MacOS Color, MacOS Monochrome) but gives all
# three the same name, "The Colony (DOS)", so each one overwrites the last and the menu entry
# ends up starting the MacOS Monochrome version. These launchers start each version by its own
# .bat file.

[The Colony (DOS)]
replaces = The Colony (DOS)
exe      = Launch The Colony (DOS).bat

[The Colony (MacOS Color)]
replaces = The Colony (DOS)
exe      = Launch The Colony (MacOS Color).bat

[The Colony (MacOS Monochrome)]
replaces = The Colony (DOS)
exe      = Launch The Colony (MacOS Monochrome).bat
