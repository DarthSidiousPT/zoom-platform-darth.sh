; Settings for the e-Racer ddraw limiter (ddraw.dll in this folder).
; Without this file the defaults are used: fps = 60, vsync = on.

[limiter]
; Highest frame rate the game may present: a whole number from 0 to 1000.
; 0 turns the cap off. Anything that is not such a number means 60.
fps = 60

; Write on or off, in any capitals (OFF works too). no and false also mean off.
; on: the game waits for the screen as it normally does.
; off: never wait for the screen. Frames are still capped by fps, but the picture can tear.
; Any other text, even 0, means on.
vsync = on
