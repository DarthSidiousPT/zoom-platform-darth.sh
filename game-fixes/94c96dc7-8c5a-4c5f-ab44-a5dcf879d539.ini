# e-Racer
#
# The game sets a very dark gamma curve at startup and Wine applies it as it is, so the 3D
# scene is almost black. With NoGamma set, the game skips that step.
#
# Under Proton the game also runs at the screen's refresh rate, and parts of its game logic
# seem to follow the frame rate. A small replacement ddraw.dll caps it at 60. Its source and
# build script are in game-fixes/src/ddraw-limiter, and ddraw-darth.ini in the game's folder
# holds its settings.
#
# Gamepads: Xidi (unmodified, BSD) makes the game see a standard pad, with the triggers on one
# axis, and Xidi.ini in the game's folder holds a 10% left-stick deadzone for worn-out sticks.
# Both come in one zip.

[wine registry]
HKCU\Software\Rage Games Ltd\eRacer\NoGamma = dword:1

[files]
zip          = eracer-fixes-1.0.zip
zip_sha512   = 94dc5408c2d0e28fecdeb8af4d3ac9b40199d1026edab2820aacee81b06e4e43fc957626fff5065f8d728f91fb9cbaba29d0646bf7126caf633e9cde2849c487
files        = ddraw.dll, LICENSE-ddraw-limiter.txt, dinput.dll, Xidi.32.dll, LICENSE-Xidi.txt
config       = ddraw-darth.ini, Xidi.ini
backup       = ddraw.dll
# dll_override is for scripts older than v1.5.3, which read one name; newer ones use dll_overrides
dll_override = ddraw
dll_overrides = ddraw, dinput
