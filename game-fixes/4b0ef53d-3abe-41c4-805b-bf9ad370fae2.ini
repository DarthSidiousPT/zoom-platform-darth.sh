# Warm Up!
#
# With umu's default Proton (UMU-Proton) the intro videos play, but the video window shown after
# quitting shows colour bars, and the "Select Rendering DLL" window in Graphics Settings comes
# up empty. Both work on GE-Proton, so this game runs on one tested build of it. The install
# downloads that build once into ~/.local/share/Steam/compatibilitytools.d, after
# checking it against the checksum below, and the install and the game's launchers use it.
# Tested on 2026-10-02.

proton        = GE-Proton11-7
proton_asset  = GE-Proton11-7-x86_64.tar.gz
proton_sha512 = 7db87e9787e20c35cbdac26018431d5794626b626e4067b050684e45a88cc2ca229d7d263519eafb2e168cde5bef57611065d159d3685aaec152ccb9abe3073f
