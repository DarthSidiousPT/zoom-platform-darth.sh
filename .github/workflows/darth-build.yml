name: Build (Darth fork)

# Fork-only build: produces zoom-platform-darth.sh on every push to this fork's
# main. Whenever the VERSION file's own content (e.g. "v1.2.0-darth" - an independent
# version string, not derived from ZOOM's own version numbers) hasn't been released yet,
# it also publishes it as a permanent GitHub Release tagged and titled with that string,
# marked as the latest release, with the body taken from RELEASE_NOTES.md plus a "Not an
# official ZOOM Platform release" quote (same scheme as the innoextract fork's own
# darth-build.yml - bump VERSION by hand and update RELEASE_NOTES.md to cut a release; a
# plain push that doesn't touch VERSION only builds). Guarded by the repository check
# below so that if this file is ever pulled into Zoom's official repo (e.g. by accident
# via a future PR), it stays inert there instead of running.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'DarthSidiousPT/zoom-platform-darth.sh'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Read fork version from VERSION file
        id: ver
        run: |
          version=$(cat VERSION)
          if [ -z "$version" ]; then
            echo "VERSION file is empty." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # VERSION is already the full version string, with its "v" and "-darth"
          # (e.g. "v1.2.0-darth"), so the tag is just that string as-is. Older releases
          # (Darth-1.0.2 ... Darth-1.2.0) predate this naming and are left as they are.
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether that version was already released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" > /dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x dist.sh
          chmod +x build.sh
          ./dist.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: zoom-platform-darth
          path: zoom-platform-darth.sh

      # The release body is RELEASE_NOTES.md (edit it in the same commit that bumps
      # VERSION) followed by the "Not an official" quote, so that line is never forgotten.
      # A missing RELEASE_NOTES.md fails this step, before anything is published.
      - name: Compose the release notes
        if: steps.check.outputs.is_new == 'true'
        run: |
          {
            cat RELEASE_NOTES.md
            printf '\n> Not an official ZOOM Platform release.\n'
          } > release_body.md

      # Only published when VERSION was bumped, so a plain push to main that didn't
      # change VERSION just builds.
      - name: Publish versioned release
        if: steps.check.outputs.is_new == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ steps.ver.outputs.tag }}"
          artifacts: "zoom-platform-darth.sh"
          name: "${{ steps.ver.outputs.tag }}"
          bodyFile: release_body.md
          allowUpdates: false
          makeLatest: true

  # Deploys the fork's own website (site/) to GitHub Pages, after every push to main
  # (not only a push that bumps VERSION). It always serves the latest *release* asset,
  # never an unreleased main build, so a broken script on main never goes live: the
  # download step fails the job before anything is deployed. Needs Settings > Pages >
  # Source = "GitHub Actions" set once, by hand, before the first run.
  pages:
    if: github.repository == 'DarthSidiousPT/zoom-platform-darth.sh'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v3

      - name: Fetch the latest release asset as the page's downloadable script
        run: |
          curl -fsSL -o site/i \
            https://github.com/DarthSidiousPT/zoom-platform-darth.sh/releases/latest/download/zoom-platform-darth.sh

      - name: Stamp the page with that release's version
        run: |
          version=$(grep -m1 '^INSTALLER_VERSION=' site/i | sed -E 's/INSTALLER_VERSION="(.*)"/\1/')
          if [ -z "$version" ]; then
            echo "Could not read INSTALLER_VERSION from the downloaded script." >&2
            exit 1
          fi
          sed -i "s/__LATEST_VERSION__/$version/" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing, Yandex and the engines that use IndexNow about the new deploy. The key
      # file is public by design (site/<key>.txt). A failed ping must never fail the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          SITE: https://darthsidiouspt.github.io/zoom-platform-darth.sh/
          INDEXNOW_KEY: 5cfa87821c7aded5291fc19ffcd64d42
        run: |
          curl -fsS "https://api.indexnow.org/indexnow?url=${SITE}&key=${INDEXNOW_KEY}&keyLocation=${SITE}${INDEXNOW_KEY}.txt"
